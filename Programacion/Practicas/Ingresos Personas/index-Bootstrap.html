<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresos de personas - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <main class="container mt-5">
    <h1>Ingresos de personas</h1>
    <p>Registra personas y consulta el ingreso menor y el promedio de ingresos.</p>
    <button type="button" class="btn btn-primary" id="btNuevaPersona">Nueva persona</button>

    <section class="mt-4" aria-labelledby="resultados_titulo" aria-live="polite">
      <h2 id="resultados_titulo">Resultados</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <h3 class="card-title fs-5">Ingreso menor</h3>
              <p class="card-text mb-0">Monto del ingreso menor: <strong id="lblIngresoMenor">-</strong></p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <h3 class="card-title fs-5">Ingreso promedio</h3>
              <p class="card-text mb-0">Ingreso promedio: <strong id="lblPromedioIngreso">-</strong></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mt-4" id="formPersona" hidden aria-labelledby="formPersona_titulo">
      <div class="card">
        <div class="card-header">
          <h2 class="h5 mb-0" id="formPersona_titulo">Ingresar persona</h2>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label" for="inNombre">Nombre:</label>
            <input type="text" class="form-control" id="inNombre" autocomplete="name" maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label" for="inIngresos">Ingreso:</label>
            <input type="number" class="form-control" id="inIngresos" min="0" step="any">
          </div>
          <p id="mensajeError" class="text-danger" role="alert" aria-live="assertive"></p>
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-secondary" id="btCancelar">Cancelar</button>
            <button type="button" class="btn btn-success" id="btAceptar">Aceptar</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import cIngresos from "./dist/controllers/cIngresos.js";
    import cPersona from "./dist/controllers/cPersona.js";
    import vIngresosPlain from "./dist/views/vIngresosPlain.js";
    import vPersonaPlain from "./dist/views/vPersonaPlain.js";

    const vistaIngresos = new vIngresosPlain();
    const vistaPersona = new vPersonaPlain();
    const controladorPersona = new cPersona(vistaPersona);
    new cIngresos(vistaIngresos, controladorPersona);
  </script>
</body>
</html>
