<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ganancia Artículos - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div id="app-bootstrap" class="container mt-5">
    <h2>Gestión de Tienda</h2>
    <button type="button" class="btn btn-primary" id="body_btNuevoArticulo">Nuevo Artículo</button>
    <hr>
    <div class="alert alert-info">
      Ganancia Total: <span id="body_lblGananciaTotal" class="fw-bold">0</span><br>
      Código del artículo con mayor precio de venta: <span id="body_lblCodigoMayor" class="fw-bold">0</span>
    </div>
  </div>

  <div class="modal fade" id="articulo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Procesar Artículo</h5>
        </div>
        <div class="modal-body">
          <label class="form-label">Código:</label>
          <input type="number" class="form-control" id="articulo_inCodigo">
          <label class="form-label">Costo:</label>
          <input type="number" class="form-control" id="articulo_inCosto">
          <label class="form-label">Precio de Venta:</label>
          <input type="number" class="form-control" id="articulo_inPrecioVenta">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="articulo_btCancelar">Cancelar</button>
          <button type="button" class="btn btn-success" id="articulo_btAceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import cTienda from "./dist/controllers/cTienda.js";
    import cArticulo from "./dist/controllers/cArticulo.js";

    import vTiendaBootstrap from "./dist/views/vTiendaBootstrap.js";
    import vArticuloBootstrap from "./dist/views/vArticuloBootstrap.js";

    const vistaTienda = new vTiendaBootstrap();
    const vistaArticulo = new vArticuloBootstrap();

    const controladorArticulo = new cArticulo(vistaArticulo);
    new cTienda(vistaTienda, controladorArticulo);
  </script>
</body>

</html>
