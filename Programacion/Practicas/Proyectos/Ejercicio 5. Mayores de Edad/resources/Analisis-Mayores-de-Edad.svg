<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img" aria-labelledby="title description">
  <title id="title">Mayores de edad: análisis y diseño</title>
  <desc id="description">Infografía con los datos de doce personas, el criterio de mayoría de edad, los resultados y la lógica de las clases Persona y Mayores.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e9edf0" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="1360" fill="#f5f7f6"/>
  <rect width="1600" height="1360" fill="url(#grid)" opacity=".55"/>
  <rect width="1600" height="18" fill="#157a72"/>

  <text x="80" y="76" fill="#157a72" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ANÁLISIS Y DISEÑO · PROGRAMACIÓN ORIENTADA A OBJETOS</text>
  <text x="80" y="145" fill="#172a36" font-family="Georgia, serif" font-size="58" font-weight="700">Mayores de edad</text>
  <text x="82" y="187" fill="#52636b" font-family="Arial, sans-serif" font-size="24">Clasificación de personas y porcentaje de mayores de edad.</text>
  <rect x="1316" y="86" width="204" height="55" rx="8" fill="#172a36"/>
  <text x="1418" y="121" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">CASO · PERSONAS</text>

  <rect x="80" y="226" width="700" height="700" rx="12" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/>
  <rect x="80" y="226" width="700" height="70" rx="12" fill="#172a36"/>
  <path d="M80 284h700v12H80z" fill="#172a36"/>
  <text x="112" y="271" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">01  ·  Datos de entrada</text>
  <text x="118" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">NOMBRE</text>
  <text x="390" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">EDAD</text>
  <text x="570" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">CLASIFICACIÓN</text>
  <path d="M108 350H752" stroke="#cad4d5" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="21" fill="#172a36">
    <text x="124" y="388">Luis</text><text x="399" y="388">15</text><text x="570" y="388" fill="#52636b">Menor</text>
    <text x="124" y="429">Ana</text><text x="399" y="429">19</text><text x="570" y="429" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="470">José</text><text x="399" y="470">21</text><text x="570" y="470" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="511">Carmen</text><text x="399" y="511">17</text><text x="570" y="511" fill="#52636b">Menor</text>
    <rect x="104" y="522" width="652" height="39" rx="5" fill="#e6f3f0"/>
    <text x="124" y="552">Rosa</text><text x="399" y="552">18</text><text x="570" y="552" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="593">José</text><text x="399" y="593">22</text><text x="570" y="593" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="634">María</text><text x="399" y="634">17</text><text x="570" y="634" fill="#52636b">Menor</text>
    <text x="124" y="675">Luz</text><text x="399" y="675">19</text><text x="570" y="675" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="716">Rafael</text><text x="399" y="716">23</text><text x="570" y="716" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="757">Liz</text><text x="399" y="757">15</text><text x="570" y="757" fill="#52636b">Menor</text>
    <text x="124" y="798">Marcos</text><text x="399" y="798">20</text><text x="570" y="798" fill="#157a72" font-weight="700">Mayor</text>
    <text x="124" y="839">Leo</text><text x="399" y="839">16</text><text x="570" y="839" fill="#52636b">Menor</text>
  </g>
  <path d="M108 858H752" stroke="#cad4d5" stroke-width="2"/>
  <text x="112" y="894" fill="#52636b" font-family="Arial, sans-serif" font-size="17">Mayor de edad = 18 años o más</text>

  <rect x="812" y="226" width="708" height="250" rx="12" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/>
  <text x="848" y="273" fill="#157a72" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">02  ·  REQUERIMIENTOS</text>
  <circle cx="858" cy="326" r="6" fill="#d5893d"/>
  <text x="880" y="334" fill="#172a36" font-family="Arial, sans-serif" font-size="25">Leer nombre y edad de cada persona.</text>
  <circle cx="858" cy="381" r="6" fill="#d5893d"/>
  <text x="880" y="389" fill="#172a36" font-family="Arial, sans-serif" font-size="25">Reportar cantidad total, cantidad de mayores</text>
  <text x="880" y="423" fill="#172a36" font-family="Arial, sans-serif" font-size="25">y su porcentaje.</text>
  <text x="848" y="454" fill="#52636b" font-family="Arial, sans-serif" font-size="17">Se considera mayor a quien tiene 18 años o más.</text>

  <rect x="812" y="500" width="708" height="426" rx="12" fill="#172a36"/>
  <text x="848" y="548" fill="#9bd5c8" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">03  ·  RESULTADOS</text>
  <text x="848" y="600" fill="#c5d2d3" font-family="Arial, sans-serif" font-size="21">Cantidad de personas</text>
  <text x="1468" y="600" text-anchor="end" fill="#ffffff" font-family="Georgia, serif" font-size="32" font-weight="700">12</text>
  <path d="M848 624H1484" stroke="#45606a" stroke-width="2"/>
  <text x="848" y="669" fill="#c5d2d3" font-family="Arial, sans-serif" font-size="21">Personas mayores de edad</text>
  <text x="1468" y="669" text-anchor="end" fill="#ffffff" font-family="Georgia, serif" font-size="32" font-weight="700">7</text>
  <path d="M848 693H1484" stroke="#45606a" stroke-width="2"/>
  <text x="848" y="740" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Porcentaje de mayores</text>
  <rect x="848" y="763" width="636" height="112" rx="8" fill="#d5893d"/>
  <text x="1166" y="840" text-anchor="middle" fill="#172a36" font-family="Georgia, serif" font-size="64" font-weight="700">58.33%</text>
  <text x="1166" y="902" text-anchor="middle" fill="#c5d2d3" font-family="Arial, sans-serif" font-size="17">(7 ÷ 12) × 100</text>

  <rect x="80" y="966" width="700" height="302" rx="12" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/>
  <text x="112" y="1012" fill="#157a72" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">04  ·  DISEÑO DE CLASES</text>
  <text x="112" y="1062" fill="#172a36" font-family="Georgia, serif" font-size="30" font-weight="700">Persona</text>
  <text x="112" y="1099" fill="#52636b" font-family="Arial, sans-serif" font-size="21">nombre · edad</text>
  <path d="M112 1121H744" stroke="#d7dfdf" stroke-width="2"/>
  <text x="112" y="1160" fill="#172a36" font-family="Georgia, serif" font-size="30" font-weight="700">Mayores</text>
  <text x="112" y="1197" fill="#52636b" font-family="Arial, sans-serif" font-size="20">_acPersonas · _contMayores · procesar() · returnPorcMayores()</text>

  <rect x="812" y="966" width="708" height="302" rx="12" fill="#e8f1ef" stroke="#c5d9d5" stroke-width="2"/>
  <text x="848" y="1012" fill="#157a72" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">05  ·  LÓGICA ESENCIAL</text>
  <rect x="848" y="1038" width="636" height="74" rx="7" fill="#ffffff"/>
  <text x="874" y="1070" fill="#172a36" font-family="Arial, sans-serif" font-size="21" font-weight="700">procesar(persona)</text>
  <text x="874" y="1097" fill="#157a72" font-family="Arial, sans-serif" font-size="19">acPersonas++ · si edad ≥ 18, contMayores++</text>
  <text x="848" y="1151" fill="#172a36" font-family="Arial, sans-serif" font-size="20">Porcentaje = (contMayores ÷ acPersonas) × 100</text>
  <text x="848" y="1194" fill="#52636b" font-family="Arial, sans-serif" font-size="18">Si no hay personas, el porcentaje es 0.</text>

  <text x="80" y="1312" fill="#52636b" font-family="Arial, sans-serif" font-size="16">Cálculos basados en las 12 personas del enunciado.</text>
  <text x="1520" y="1312" text-anchor="end" fill="#157a72" font-family="Arial, sans-serif" font-size="16" font-weight="700">7 DE 12 PERSONAS · 58.33%</text>
</svg>