<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title description">
  <title id="title">Ganancia de artículos: análisis y diseño</title>
  <desc id="description">Infografía con los datos de ocho artículos, requerimientos, resultados y lógica de las clases Artículo y Tienda.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e9edf0" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="1250" fill="#f5f7f6"/>
  <rect width="1600" height="1250" fill="url(#grid)" opacity=".55"/>
  <rect width="1600" height="18" fill="#157a72"/>

  <text x="80" y="76" fill="#157a72" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ANÁLISIS Y DISEÑO · PROGRAMACIÓN ORIENTADA A OBJETOS</text>
  <text x="80" y="145" fill="#172a36" font-family="Georgia, serif" font-size="58" font-weight="700">Ganancia de artículos</text>
  <text x="82" y="187" fill="#52636b" font-family="Arial, sans-serif" font-size="24">Una tienda registra costo y precio de venta para cada artículo.</text>
  <rect x="1316" y="86" width="204" height="55" rx="8" fill="#172a36"/>
  <text x="1418" y="121" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">CASO · TIENDA</text>

  <rect x="80" y="226" width="700" height="602" rx="12" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/>
  <rect x="80" y="226" width="700" height="70" rx="12" fill="#172a36"/>
  <path d="M80 284h700v12H80z" fill="#172a36"/>
  <text x="112" y="271" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">01  ·  Datos de entrada</text>
  <text x="116" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">CÓDIGO</text>
  <text x="300" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">COSTO</text>
  <text x="454" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">VENTA</text>
  <text x="625" y="333" fill="#52636b" font-family="Arial, sans-serif" font-size="18" font-weight="700">GANANCIA</text>
  <path d="M108 350H752" stroke="#cad4d5" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="23" fill="#172a36">
    <text x="126" y="394">888</text><text x="316" y="394">$10</text><text x="478" y="394">$15</text><text x="657" y="394" fill="#157a72" font-weight="700">$5</text>
    <text x="126" y="448">777</text><text x="316" y="448">$20</text><text x="478" y="448">$25</text><text x="657" y="448" fill="#157a72" font-weight="700">$5</text>
    <text x="126" y="502">999</text><text x="316" y="502">$15</text><text x="478" y="502">$25</text><text x="657" y="502" fill="#157a72" font-weight="700">$10</text>
    <text x="126" y="556">666</text><text x="316" y="556">$25</text><text x="478" y="556">$35</text><text x="657" y="556" fill="#157a72" font-weight="700">$10</text>
    <text x="126" y="610">111</text><text x="316" y="610">$50</text><text x="478" y="610">$70</text><text x="657" y="610" fill="#157a72" font-weight="700">$20</text>
    <text x="126" y="664">333</text><text x="316" y="664">$40</text><text x="478" y="664">$50</text><text x="657" y="664" fill="#157a72" font-weight="700">$10</text>
    <rect x="98" y="680" width="664" height="48" rx="6" fill="#e6f3f0"/>
    <text x="126" y="718" fill="#172a36" font-weight="700">444</text><text x="316" y="718" fill="#172a36" font-weight="700">$80</text><text x="478" y="718" fill="#172a36" font-weight="700">$100</text><text x="657" y="718" fill="#157a72" font-weight="700">$20</text>
    <text x="126" y="772">222</text><text x="316" y="772">$5</text><text x="478" y="772">$10</text><text x="657" y="772" fill="#157a72" font-weight="700">$5</text>
  </g>
  <text x="112" y="810" fill="#52636b" font-family="Arial, sans-serif" font-size="17">Ganancia por artículo = precio de venta − costo</text>

  <rect x="812" y="226" width="708" height="250" rx="12" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/>
  <text x="848" y="273" fill="#157a72" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">02  ·  REQUERIMIENTOS</text>
  <circle cx="858" cy="326" r="6" fill="#d5893d"/>
  <text x="880" y="334" fill="#172a36" font-family="Arial, sans-serif" font-size="25">Calcular la ganancia total de todos los artículos.</text>
  <circle cx="858" cy="381" r="6" fill="#d5893d"/>
  <text x="880" y="389" fill="#172a36" font-family="Arial, sans-serif" font-size="25">Identificar el código del artículo con mayor</text>
  <text x="880" y="423" fill="#172a36" font-family="Arial, sans-serif" font-size="25">precio de venta.</text>
  <text x="848" y="454" fill="#52636b" font-family="Arial, sans-serif" font-size="17">Procesamiento secuencial: un artículo a la vez.</text>

  <rect x="812" y="500" width="708" height="328" rx="12" fill="#172a36"/>
  <text x="848" y="548" fill="#9bd5c8" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">03  ·  RESULTADOS</text>
  <text x="848" y="594" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Ganancia total</text>
  <text x="848" y="666" fill="#ffffff" font-family="Georgia, serif" font-size="62" font-weight="700">$85</text>
  <path d="M1110 574v169" stroke="#45606a" stroke-width="2"/>
  <text x="1150" y="594" fill="#ffffff" font-family="Arial, sans-serif" font-size="23">Mayor precio de venta</text>
  <text x="1150" y="666" fill="#ffffff" font-family="Georgia, serif" font-size="54" font-weight="700">$100</text>
  <rect x="1150" y="691" width="302" height="58" rx="7" fill="#d5893d"/>
  <text x="1172" y="728" fill="#172a36" font-family="Arial, sans-serif" font-size="22" font-weight="700">Código del artículo: 444</text>
  <text x="848" y="779" fill="#c5d2d3" font-family="Arial, sans-serif" font-size="18">La ganancia acumulada suma las diferencias venta − costo.</text>

  <rect x="80" y="866" width="700" height="302" rx="12" fill="#ffffff" stroke="#d7dfdf" stroke-width="2"/>
  <text x="112" y="912" fill="#157a72" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">04  ·  DISEÑO DE CLASES</text>
  <text x="112" y="962" fill="#172a36" font-family="Georgia, serif" font-size="30" font-weight="700">Artículo</text>
  <text x="112" y="999" fill="#52636b" font-family="Arial, sans-serif" font-size="21">codigo · costo · precioVenta</text>
  <text x="112" y="1034" fill="#157a72" font-family="Arial, sans-serif" font-size="21" font-weight="700">ganancia() = precioVenta − costo</text>
  <path d="M112 1055H744" stroke="#d7dfdf" stroke-width="2"/>
  <text x="112" y="1094" fill="#172a36" font-family="Georgia, serif" font-size="30" font-weight="700">Tienda</text>
  <text x="112" y="1131" fill="#52636b" font-family="Arial, sans-serif" font-size="20">acumGanancia · mayorPrecioVenta · auxCodigoMayor</text>

  <rect x="812" y="866" width="708" height="302" rx="12" fill="#e8f1ef" stroke="#c5d9d5" stroke-width="2"/>
  <text x="848" y="912" fill="#157a72" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">05  ·  LÓGICA ESENCIAL</text>
  <rect x="848" y="938" width="636" height="74" rx="7" fill="#ffffff"/>
  <text x="874" y="970" fill="#172a36" font-family="Arial, sans-serif" font-size="21" font-weight="700">procesarArticulo(articulo)</text>
  <text x="874" y="997" fill="#157a72" font-family="Arial, sans-serif" font-size="19">acumGanancia += articulo.ganancia()</text>
  <text x="848" y="1051" fill="#172a36" font-family="Arial, sans-serif" font-size="20">Si precioVenta supera el récord, actualizar ambos:</text>
  <text x="874" y="1085" fill="#172a36" font-family="Arial, sans-serif" font-size="19">mayorPrecioVenta = articulo.precioVenta</text>
  <text x="874" y="1116" fill="#172a36" font-family="Arial, sans-serif" font-size="19">auxCodigoMayor = articulo.codigo</text>
  <text x="848" y="1148" fill="#52636b" font-family="Arial, sans-serif" font-size="17">Reportes: gananciaTotal() y codigoMayorPrecio().</text>

  <text x="80" y="1210" fill="#52636b" font-family="Arial, sans-serif" font-size="16">Resultado obtenido con los 8 artículos de los datos de ejemplo.</text>
  <text x="1520" y="1210" text-anchor="end" fill="#157a72" font-family="Arial, sans-serif" font-size="16" font-weight="700">GANANCIA = VENTA − COSTO</text>
</svg>